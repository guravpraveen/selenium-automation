# =====================================================================
#  Database connections. NEVER commit real passwords:
#  use ${ENV_VAR} placeholders and export the variables on your machine / CI.
# =====================================================================

# ---------- Oracle (e.g. Liquidity Management) ----------
oracle.url=jdbc:oracle:thin:@//oracle-host.example.com:1521/LMQA
oracle.username=LM_TEST_RO
oracle.password=${ORACLE_DB_PASSWORD}
oracle.driver=oracle.jdbc.OracleDriver
oracle.query.timeout=60

# ---------- Second Oracle connection (e.g. RTGS engine) ----------
oracle.rtgs.url=jdbc:oracle:thin:@//rtgs-db.example.com:1521/RTGSQA
oracle.rtgs.username=RTGS_TEST_RO
oracle.rtgs.password=${ORACLE_RTGS_DB_PASSWORD}
oracle.rtgs.driver=oracle.jdbc.OracleDriver

# ---------- SAP HANA (e.g. CBPR+ payments hub) ----------
hana.url=jdbc:sap://hana-host.example.com:30015/?currentschema=PAYMENTS&encrypt=true&validateCertificate=false
hana.username=PAY_TEST_RO
hana.password=${HANA_DB_PASSWORD}
hana.driver=com.sap.db.jdbc.Driver
hana.query.timeout=60

# ---------- H2 in-memory (offline practice, Oracle compatibility mode) ----------
h2.url=jdbc:h2:mem:paymentsdb;MODE=Oracle;DB_CLOSE_DELAY=-1
h2.username=sa
h2.password=
h2.driver=org.h2.Driver
