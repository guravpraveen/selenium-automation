# =====================================================================
#  Common configuration - any key can be overridden with -Dkey=value
# =====================================================================
env=qa
app.name=Payments Hub

# ---------- Browser ----------
# chrome | firefox | edge | safari | chrome_mobile_emulation | android_chrome | ios_safari
browser=chrome
headless=false
browser.maximize=true
# Optional: custom Chrome binary path (leave blank to let Selenium Manager decide)
chrome.binary=
mobile.emulation.device=Pixel 7

# ---------- Selenium Grid (blank = run locally) ----------
grid.url=

# ---------- Appium (mobile browsers) ----------
appium.url=http://127.0.0.1:4723
appium.android.deviceName=Android Emulator
appium.android.platformVersion=14
appium.ios.deviceName=iPhone 15
appium.ios.platformVersion=17.5

# ---------- Waits (seconds) ----------
implicit.wait=0
explicit.wait=20
page.load.timeout=60
script.timeout=30

# ---------- Execution ----------
retry.count=0

# ---------- API ----------
api.timeout.ms=30000
api.relaxed.https=false
api.log.console=false

# ---------- Database selection ----------
# Default DB when a test does not name an application: oracle | hana | h2
db.type=h2
# Application -> database mapping (DatabaseFactory.forApplication("liquidity"))
app.liquidity.db=oracle
app.cbpr.db=hana
app.rtgs.db=oracle.rtgs
app.practice.db=h2
